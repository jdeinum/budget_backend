[package]
name = "budget"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
csv = "1.4.0"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
# Transitive-dependency version skew (base64, syn, sha2, ...) — out of our
# control short of pinning every indirect dep; `cargo deny check` (see
# deny.toml, run in CI) already covers dependency hygiene with a proper
# skip-list mechanism for exactly this. `priority` is required so this
# specific-lint entry actually overrides the `cargo = "deny"` group above —
# without it cargo treats the two as equal-priority and keeps both.
multiple_crate_versions = { level = "allow", priority = 1 }

[dev-dependencies]
tempfile = "3.14"
# Adds RequestBuilder::query, used by the tests/ HTTP client — prod code
# never needs it, so it's kept out of the main reqwest dependency's features.
reqwest = { version = "0.13.4", default-features = false, features = ["query"] }
wiremock = "0.6"
quickcheck = "1"
insta = "1"
